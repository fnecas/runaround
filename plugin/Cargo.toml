[package]
name = "runaround-plugin"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "WebAssembly plugin of the runaround Typst package: image contours."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
png = "0.18"
gif = "0.14"
image-webp = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-minimal-protocol = "0.2.1"
