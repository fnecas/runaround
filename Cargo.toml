[workspace]
resolver = "2"
members = ["harness", "xtask", "plugin"]
default-members = ["harness", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

# Typst is slow when built without optimisations; keep test runs fast.
[profile.dev.package."*"]
opt-level = 2
# Full debug info for typst bloats every test binary to ~640 MB.
debug = false

# Size-optimised profile for the WebAssembly plugin (`cargo xtask plugin`).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
